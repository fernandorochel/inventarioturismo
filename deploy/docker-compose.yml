# ============================================================
# Gestão do Turismo de Itatinga — Docker Compose
# Deploy: Easypanel em inventario.turismoitatinga.com.br
# ============================================================

services:

  # ── Banco de dados ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       turismo
      POSTGRES_USER:     turismo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turismo -d turismo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Node.js ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        APP_BUILD_VERSION: "2026-08-10-multiuser-v6"
    restart: unless-stopped
    environment:
      DATABASE_URL:   postgres://turismo:${DB_PASSWORD}@postgres:5432/turismo
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV:       production
      COOKIE_SECURE:  ${COOKIE_SECURE:-false}
      PORT:           80
      GOOGLE_DRIVE_UPLOAD_FOLDER_ID: ${GOOGLE_DRIVE_UPLOAD_FOLDER_ID:-}
      GOOGLE_OAUTH_CLIENT_ID:        ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET:    ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REFRESH_TOKEN:    ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_UPLOAD_PUBLIC:    ${GOOGLE_DRIVE_UPLOAD_PUBLIC:-false}
      GOOGLE_DRIVE_UPLOAD_PUBLIC_IMAGES: ${GOOGLE_DRIVE_UPLOAD_PUBLIC_IMAGES:-true}
      GOOGLE_DRIVE_USE_TYPE_FOLDERS: ${GOOGLE_DRIVE_USE_TYPE_FOLDERS:-true}
      FILE_UPLOAD_DIR:               /app/uploads
      FILE_UPLOAD_PUBLIC_PATH:       /uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
      easypanel:
        aliases:
          - turismo-itatinga_inventario_undefined
          - turismo-itatinga-inventario
volumes:
  postgres_data:
  uploads_data:

networks:
  easypanel:
    external: true
    name: easypanel
