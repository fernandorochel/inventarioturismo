<style>
  :root{
    --azul-escuro:#1A3A6E; --azul-med:#2563B0; --azul-claro:#E3F0FB;
    --cinza:#2D2D2D; --cinza-claro:#6b7280; --linha:#e5e7eb; --bg:#f4f6fb;
    --verde:#1f9d55; --ambar:#d97706; --vermelho:#dc2626; --branco:#fff;
    --sombra:0 1px 3px rgba(16,38,73,.08),0 1px 2px rgba(16,38,73,.06);
    --sombra-md:0 4px 16px rgba(16,38,73,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--cinza);font-size:14px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none}
  a{color:var(--azul-med);text-decoration:none}
  .hidden{display:none!important}
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
         background:linear-gradient(135deg,#1A3A6E,#2563B0);padding:20px;z-index:100}
  .login-card{background:#fff;border-radius:16px;box-shadow:var(--sombra-md);width:100%;max-width:400px;padding:36px 32px;text-align:center}
  .login-card .logos{display:flex;gap:14px;justify-content:center;align-items:center;margin-bottom:18px}
  .login-card .logos img{height:46px;object-fit:contain}
  .login-card h1{font-size:19px;color:var(--azul-escuro);margin-bottom:4px}
  .login-card p.sub{color:var(--cinza-claro);font-size:12.5px;margin-bottom:24px}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--azul-escuro);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--linha);border-radius:9px;font-size:14px;background:#fff;transition:border .15s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--azul-med);box-shadow:0 0 0 3px rgba(37,99,176,.12)}
  .btn{background:var(--azul-escuro);color:#fff;padding:11px 16px;border-radius:9px;font-weight:600;font-size:14px;width:100%;transition:background .15s}
  .btn:hover{background:#15315c}
  .btn-sec{background:#fff;color:var(--azul-escuro);border:1px solid var(--linha);width:auto;padding:8px 14px}
  .btn-sec:hover{background:var(--azul-claro)}
  .btn-sm{padding:6px 11px;font-size:12.5px;width:auto;border-radius:8px}
  .login-err{color:var(--vermelho);font-size:12.5px;margin-top:8px;min-height:16px}
  #app{display:none;min-height:100vh}
  header.topbar{background:#fff;border-bottom:1px solid var(--linha);height:62px;display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:40;box-shadow:var(--sombra)}
  header.topbar .logos{display:flex;align-items:center;gap:12px}
  header.topbar .logos img{height:38px;object-fit:contain}
  header.topbar .brand{margin-left:6px}
  header.topbar .brand .t1{font-size:15px;font-weight:700;color:var(--azul-escuro);line-height:1.1}
  header.topbar .brand .t2{font-size:11px;color:var(--cinza-claro)}
  header.topbar .search{flex:1;max-width:420px;margin:0 auto;position:relative}
  header.topbar .search input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--linha);border-radius:20px;background:var(--bg);font-size:13px}
  header.topbar .search svg{position:absolute;left:12px;top:9px;width:16px;height:16px;color:var(--cinza-claro)}
  .user-chip{display:flex;align-items:center;gap:9px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--azul-escuro);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .user-chip .info{text-align:right;line-height:1.15}
  .user-chip .info .n{font-size:12.5px;font-weight:600;color:var(--azul-escuro)}
  .user-chip .info .r{font-size:11px;color:var(--cinza-claro)}
  .layout{display:flex}
  nav.side{width:248px;background:#fff;border-right:1px solid var(--linha);min-height:calc(100vh - 62px);padding:14px 10px;position:sticky;top:62px;overflow-y:auto;max-height:calc(100vh - 62px)}
  nav.side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--cinza-claro);padding:14px 12px 6px}
  nav.side a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--cinza);font-size:13.5px;font-weight:500;margin-bottom:2px}
  nav.side a .ic{font-size:16px;width:20px;text-align:center}
  nav.side a:hover{background:var(--azul-claro)}
  nav.side a.active{background:var(--azul-escuro);color:#fff}
  nav.side a .badge{margin-left:auto;background:var(--azul-claro);color:var(--azul-escuro);font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px}
  nav.side a.active .badge{background:rgba(255,255,255,.2);color:#fff}
  main{flex:1;padding:24px 28px;max-width:1180px}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
  .page-head h2{font-size:21px;color:var(--azul-escuro)}
  .page-head p{color:var(--cinza-claro);font-size:13px;margin-top:2px}
  .crumb{font-size:12px;color:var(--cinza-claro);margin-bottom:3px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:#fff;border:1px solid var(--linha);border-radius:13px;padding:16px 18px;box-shadow:var(--sombra)}
  .stat .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px;background:var(--azul-claro)}
  .stat .v{font-size:26px;font-weight:700;color:var(--azul-escuro);line-height:1}
  .stat .l{font-size:12.5px;color:var(--cinza-claro);margin-top:4px}
  .grid2{display:flex;flex-direction:column;gap:16px;margin-bottom:18px}
  @media(max-width:880px){.grid2{grid-template-columns:1fr}}
  .panel{background:#fff;border:1px solid var(--linha);border-radius:13px;padding:18px;box-shadow:var(--sombra)}
  .panel h3{font-size:14px;color:var(--azul-escuro);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .quick button{background:var(--azul-claro);color:var(--azul-escuro);border-radius:10px;padding:14px 10px;font-weight:600;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .quick button:hover{background:#d3e6f9}
  .quick button .ic{font-size:20px}
  ul.feed{list-style:none}
  ul.feed li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--linha);font-size:12.5px}
  ul.feed li:last-child{border:none}
  ul.feed .dot{width:8px;height:8px;border-radius:50%;background:var(--azul-med);margin-top:6px;flex:none}
  ul.feed .when{margin-left:auto;color:var(--cinza-claro);font-size:11.5px;white-space:nowrap}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input,.toolbar select{padding:8px 11px;border:1px solid var(--linha);border-radius:9px;font-size:13px;background:#fff}
  .toolbar .grow{flex:1;min-width:160px}
  .tablewrap{background:#fff;border:1px solid var(--linha);border-radius:13px;overflow:hidden;box-shadow:var(--sombra);overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{background:#f8fafc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--cinza-claro);padding:11px 14px;border-bottom:1px solid var(--linha);white-space:nowrap}
  td{padding:12px 14px;border-bottom:1px solid var(--linha);font-size:13px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.row:hover{background:var(--azul-claro);cursor:pointer}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:11px;background:var(--azul-claro);color:var(--azul-escuro)}
  .pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:11px}
  .pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.off{background:#f1f5f9;color:#475569}.pill.rev{background:#dbeafe;color:#1e40af}.pill.err{background:#fee2e2;color:#991b1b}
  .rowact{display:flex;gap:6px;justify-content:flex-end}
  .iconbtn{background:#fff;border:1px solid var(--linha);border-radius:7px;padding:5px 8px;font-size:12px}
  .iconbtn:hover{background:var(--azul-claro)}
  .empty{padding:40px;text-align:center;color:var(--cinza-claro)}
  .modal-bg{position:fixed;inset:0;background:rgba(16,38,73,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:80;overflow-y:auto}
  .modal{background:#fff;border-radius:15px;width:100%;max-width:680px;box-shadow:var(--sombra-md);animation:pop .15s ease}
  @keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
  .modal .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--linha);position:sticky;top:0;background:#fff;border-radius:15px 15px 0 0}
  .modal .mh h3{font-size:16px;color:var(--azul-escuro)}
  .modal .mh .x{background:none;font-size:22px;color:var(--cinza-claro);line-height:1}
  .modal .mb{padding:20px 22px;max-height:68vh;overflow-y:auto}
  .modal .mf{padding:14px 22px;border-top:1px solid var(--linha);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 15px 15px}
  .det-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--linha);font-size:13.5px}
  .det-row:last-child{border:none}
  .det-row .k{font-weight:600;color:var(--azul-escuro);min-width:200px;flex:none}
  .det-row .v{color:var(--cinza)}
  .form-sec,.det-sec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--azul-med);font-weight:700;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--linha)}
  .form-sec:first-child,.det-sec:first-child{margin-top:2px}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .formgrid .full{grid-column:1/-1}
  @media(max-width:560px){.formgrid{grid-template-columns:1fr}}
  .photo-box{border:1px dashed var(--linha);border-radius:9px;padding:16px;text-align:center;color:var(--cinza-claro);font-size:12.5px}
  .note{background:var(--azul-claro);border-left:3px solid var(--azul-med);padding:10px 13px;border-radius:8px;font-size:12.5px;color:var(--azul-escuro);margin-bottom:16px}
  /* Dashboard moderno */
  .dash-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .dash-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .dash-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
  /* KPI Cards — modernos com ícone */
  .kpi-card{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);transition:transform .18s,box-shadow .18s;cursor:default;position:relative;overflow:hidden}
  .kpi-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(37,99,176,.13)}
  .kpi-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;border-radius:16px 16px 0 0;background:var(--kpi-color,var(--azul-med))}
  .kpi-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
  .kpi-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--kpi-bg,#eff6ff);flex-shrink:0;transition:transform .2s}
  .kpi-card:hover .kpi-icon{transform:scale(1.12) rotate(-4deg)}
  .kpi-icon svg{width:20px;height:20px;stroke:var(--kpi-color,var(--azul-med));fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .kpi-card .kpi-lbl{font-size:11px;color:var(--cinza-claro);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
  .kpi-card .kpi-val{font-size:30px;font-weight:800;color:var(--azul-escuro);line-height:1;margin-bottom:4px}
  .kpi-card .kpi-sub{font-size:11px;color:var(--cinza-claro);display:flex;align-items:center;gap:5px;margin-top:2px}
  .kpi-card .kpi-bar{height:4px;background:var(--bg,#f1f5f9);border-radius:2px;margin-top:12px;overflow:hidden}
  .kpi-card .kpi-bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
  .badge-up{background:#dcfce7;color:#166534;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px}
  .badge-warn{background:#fef3c7;color:#92400e;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px}
  .badge-info{background:var(--azul-claro);color:var(--azul-escuro);font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px}
  .dash-panel{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);transition:box-shadow .18s}
  .dash-panel:hover{box-shadow:0 6px 22px rgba(37,99,176,.1)}
  .dash-panel h3{font-size:13px;font-weight:700;color:var(--azul-escuro);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .dash-panel h3 .ph{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .dash-panel h3 .ph svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dash-panel .see-all{margin-left:auto;font-size:11.5px;color:var(--azul-med);cursor:pointer;font-weight:600;transition:opacity .15s}
  .dash-panel .see-all:hover{opacity:.7}
  .dash-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .dash-bar-lbl{font-size:12px;color:var(--cinza);width:120px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-bar-track{flex:1;height:6px;background:var(--bg,#f1f5f9);border-radius:3px;overflow:hidden}
  .dash-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#2563B0,#1A3A6E)}
  .dash-bar-val{font-size:11px;color:var(--cinza-claro);width:30px;text-align:right;flex-shrink:0}
  .mod-tile{background:var(--bg,#f8fafc);border:1px solid var(--linha);border-radius:11px;padding:10px 12px;cursor:pointer;transition:all .18s}
  .mod-tile:hover{border-color:var(--azul-med);background:var(--azul-claro);transform:translateY(-2px);box-shadow:0 4px 14px rgba(37,99,176,.1)}
  .mod-tile:active{transform:translateY(0)}
  .mod-tile .mt-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .mod-tile .mt-n{font-size:20px;font-weight:700;color:var(--azul-escuro)}
  .mod-tile .mt-name{font-size:11px;color:var(--cinza-claro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
  .mt-prog{height:3px;background:var(--linha);border-radius:2px;overflow:hidden}
  .mt-prog-fill{height:100%;border-radius:2px}
  .alert-strip{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;background:#fef3c7;border:1px solid #fcd34d;border-radius:9px;margin-bottom:8px;font-size:12px;color:#92400e;line-height:1.45}
  .alert-strip.info{background:var(--azul-claro);border-color:var(--azul-med);color:var(--azul-escuro)}
  .qaction{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg,#f8fafc);border:1px solid var(--linha);border-radius:9px;cursor:pointer;font-size:12.5px;color:var(--cinza);margin-bottom:7px;transition:background .12s}
  .qaction:hover{background:var(--azul-claro);border-color:var(--azul-med)}
  .qaction .qa-arrow{margin-left:auto;color:var(--cinza-claro);font-size:13px}
  .grp-band{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;margin-bottom:8px;font-size:13px;font-weight:600;transition:transform .16s}
  .grp-band:hover{transform:translateX(3px)}
  .grp-band .grp-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .grp-band .grp-ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .grp-band .grp-n{margin-left:auto;font-size:22px;font-weight:800}
  @media(max-width:880px){.dash-grid4{grid-template-columns:1fr 1fr}.dash-grid3{grid-template-columns:1fr 1fr}.dash-grid2{grid-template-columns:1fr}}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--azul-escuro);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;box-shadow:var(--sombra-md);z-index:120;animation:pop .15s}

  .menu-btn{display:none;background:none;border:none;font-size:23px;color:var(--azul-escuro);margin-right:6px;cursor:pointer;line-height:1}
  .side-ov{display:none}
  @media(max-width:760px){
    .menu-btn{display:block}
    header.topbar{padding:0 12px;height:56px}
    header.topbar .brand{display:none}
    header.topbar .logos{gap:8px}
    header.topbar .logos img{height:30px}
    header.topbar .search{display:none}
    header.topbar .user-chip .info{display:none}
    header.topbar .user-chip{gap:6px}
    nav.side{position:fixed;top:56px;left:0;bottom:0;z-index:60;width:82%;max-width:300px;transform:translateX(-106%);transition:transform .22s ease;box-shadow:var(--sombra-md);max-height:none}
    nav.side.open{transform:none}
    .side-ov{position:fixed;top:56px;left:0;right:0;bottom:0;background:rgba(16,38,73,.42);z-index:55}
    .side-ov.show{display:block}
    main{padding:16px 13px;max-width:100%}
    .page-head h2{font-size:18px}
    .cards{grid-template-columns:1fr 1fr}
    .modal{max-width:100%}
    .formgrid{grid-template-columns:1fr}
    .det-row{flex-direction:column;gap:2px}
    .det-row .k{min-width:0}
  }
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <div class="logos"><img id="loginLogoP" alt="Prefeitura"><img id="loginLogoT" alt="Turismo"></div>
    <h1>Gestão do Turismo de Itatinga</h1>
    <p class="sub">Diretoria de Lazer, Turismo e Eventos</p>
    <div class="field"><label>Login</label><input id="email" type="text" placeholder="Seu login"></div>
    <div class="field"><label>Senha</label><input id="senha" type="password" placeholder="••••••••"></div>
    <button class="btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>
<div id="app">
  <header class="topbar">
    <button class="menu-btn" onclick="toggleSide()" aria-label="Menu">☰</button>
    <div class="logos"><img id="topLogoP" alt="Prefeitura"><img id="topLogoT" alt="Turismo">
      <div class="brand"><div class="t1">Gestão do Turismo de Itatinga</div><div class="t2">Inventário Turístico Municipal</div></div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="globalSearch" placeholder="Buscar em todo o sistema..." oninput="globalSearch(this.value)">
    </div>
    <div class="user-chip">
      <div class="info"><div class="n" id="uName"></div><div class="r" id="uRole"></div></div>
      <div class="avatar" id="uAv"></div>
      <button class="iconbtn" onclick="logout()" title="Sair">Sair</button>
    </div>
  </header>
  <div class="layout"><div class="side-ov" id="sideOv" onclick="closeSide()"></div><nav class="side" id="side"></nav><main id="main"></main></div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

/* ===== Reorganização de contatos + autorização de publicação no Guia (todos os módulos) ===== */
;(function(){
  const CONTACT=["responsavel","telefone","email","site","redes","whatsapp","celular"];
  const ACCESS_ORDER=[
    ["telefone","Telefone (acesso ao público)","tel"],
    ["whatsapp","WhatsApp (público)","tel"],
    ["celular","Celular (público)","tel"],
    ["email","E-mail (acesso ao público)","email"],
    ["site","Site","url"],
    ["redes","Redes sociais","text"]
  ];
  const moved=new Set([...CONTACT,"resp_telefone","publicar_guia"]);
  MODULES.forEach(m=>{
    if(!Array.isArray(m.sections))return;
    const defs={};
    m.sections.forEach(sec=>sec.f.forEach(fd=>{if(!defs[fd[0]])defs[fd[0]]=fd;}));
    const baseSecs=m.sections.map(sec=>({t:sec.t,f:sec.f.filter(fd=>!moved.has(fd[0]))})).filter(sec=>sec.f.length>0);
    const blocks=[];
    blocks.push({t:"Contato do Responsável",f:[
      ["responsavel","Nome do responsável","text"],
      ["resp_telefone","Telefone / WhatsApp do responsável","tel"]
    ]});
    const accF=[];
    ACCESS_ORDER.forEach(([nm,lbl,tp])=>{ accF.push(defs[nm]||[nm,lbl,tp]); });
    accF.push(["publicar_guia","Autorizar publicação no Guia da Cidade","sel","publicar"]);
    const contEmp={t:"Contato do Empreendimento",f:accF};
    const contResp={t:"Contato do Responsável",f:[
      ["responsavel","Nome do responsável","text"],
      ["resp_telefone","Telefone / WhatsApp do responsável","tel"]
    ]};
    /* Ordenação lógica: Identificação → Localização → Contatos → [meio] → Descrição/Observações */
    function _popSec(arr,rx){const i=arr.findIndex(s=>s.t&&rx.test(s.t));return i>=0?arr.splice(i,1)[0]:null;}
    const pool=baseSecs.slice();
    const secId  =_popSec(pool,/identifica/i);
    const secLoc =_popSec(pool,/localiza/i);
    const secDescs=[];
    [/descri/i,/observ/i,/nota/i].forEach(rx=>{const s=_popSec(pool,rx);if(s)secDescs.push(s);});
    const out=[];
    if(secId)  out.push(secId);
    if(secLoc) out.push(secLoc);
    out.push(contEmp,contResp);
    out.push(...pool);
    out.push(...secDescs);
    m.sections=out;
  });
})();

const FORM_GUARD={active:false,dirty:false,saving:false,saveFn:null};
function markFormDirty(){if(FORM_GUARD.active&&!FORM_GUARD.saving)FORM_GUARD.dirty=true;}
function clearFormGuard(){FORM_GUARD.active=false;FORM_GUARD.dirty=false;FORM_GUARD.saving=false;FORM_GUARD.saveFn=null;}
function armFormGuard(saveFn){
  FORM_GUARD.active=true;FORM_GUARD.dirty=false;FORM_GUARD.saving=false;FORM_GUARD.saveFn=saveFn||null;
  const root=document.querySelector("#modalRoot .modal");
  if(root){
    root.addEventListener("input",markFormDirty);
    root.addEventListener("change",markFormDirty);
  }
}
function askUnsavedAction(opts){
  if(document.getElementById("unsavedGuard"))return;
  const box=document.createElement("div");
  box.id="unsavedGuard";
  box.className="modal-bg";
  box.style.zIndex="9999";
  box.innerHTML=`<div class="modal" style="max-width:460px">
    <div class="mh"><h3>Alterações não salvas</h3></div>
    <div class="mb"><p>Você alterou informações neste cadastro. Salve antes de sair ou escolha sair sem salvar.</p></div>
    <div class="mf">
      <button class="btn-sec btn-sm" id="guardCancel">Continuar editando</button>
      <button class="btn-sec btn-sm" id="guardDiscard">Sair sem salvar</button>
      <button class="btn btn-sm" id="guardSave">Salvar</button>
    </div>
  </div>`;
  document.body.appendChild(box);
  const remove=()=>box.remove();
  box.querySelector("#guardCancel").onclick=remove;
  box.querySelector("#guardDiscard").onclick=()=>{remove();FORM_GUARD.dirty=false;if(opts&&opts.onDiscard)opts.onDiscard();};
  box.querySelector("#guardSave").onclick=async()=>{
    if(!FORM_GUARD.saveFn)return;
    FORM_GUARD.saving=true;
    box.querySelector("#guardSave").disabled=true;
    box.querySelector("#guardSave").textContent="Salvando...";
    try{await FORM_GUARD.saveFn();remove();if(opts&&opts.onSaved)opts.onSaved();}
    finally{FORM_GUARD.saving=false;}
  };
}
function resizeImg(src,max,q,cb){const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);try{cb(c.toDataURL("image/webp",q));}catch(e){try{cb(c.toDataURL("image/jpeg",q));}catch(_){cb(src);}}};img.onerror=()=>cb(src);img.src=src;}
function fileDataUrl(f){return new Promise((ok,fail)=>{const rd=new FileReader();rd.onload=e=>ok(e.target.result);rd.onerror=fail;rd.readAsDataURL(f);});}
function resizeImgAsync(src,max,q){return new Promise(ok=>resizeImg(src,max,q,ok));}
function driveIdFromUrl(src){
  const s=String(src||"");
  return (s.match(/drive\.google\.com\/file\/d\/([^/]+)/i)||s.match(/[?&]id=([^&]+)/i)||s.match(/drive\.google\.com\/(?:thumbnail|uc)\?[^#]*id=([^&]+)/i)||[])[1]||"";
}
function driveImageUrl(src){
  const id=driveIdFromUrl(src);
  return id?`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1600`:"";
}
function isFotoImg(src,mime){return /^image\//i.test(mime||"")||/^data:image\//i.test(src||"")||/\.(png|jpe?g|webp|gif)(\?|$)/i.test(src||"")||!!driveIdFromUrl(src);}
function fotoSrc(src,mime){if(!src)return"";if(/^data:image\//i.test(src))return src;if(driveIdFromUrl(src))return driveImageUrl(src);return src;}
function absMediaUrl(src){
  const s=String(src||"").trim();
  if(!s||/^(data:|blob:|https?:)/i.test(s))return s;
  if(s.startsWith("/"))return location.origin+s;
  return s;
}
function arquivoLink(src,nome){const n=_esc(nome||"Abrir arquivo");return `<a href="${src}" target="_blank" rel="noopener" class="btn-sec btn-sm" style="display:inline-flex;margin-bottom:8px">📎 ${n}</a>`;}
function fotoImg(src,mw,mh,nome,mime){if(!src)return"";if(isFotoImg(src,mime))return `<img src="${fotoSrc(src,mime)}" alt="${_esc(nome||"Arquivo anexado")}" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='${arquivoLink(src,nome).replace(/'/g,"&#39;")}'" style="max-width:${mw}px;max-height:${mh}px;border-radius:8px;border:1px solid var(--linha);display:block;margin-bottom:8px;object-fit:contain">`;return arquivoLink(src,nome);}
function fotoRelatorioImg(src,mw,mh,nome,mime){
  if(!src)return"";
  const href=absMediaUrl(fotoSrc(src,mime));
  if(isFotoImg(src,mime))return `<img class="rec-img" src="${_esc(href)}" alt="${_esc(nome||"Arquivo anexado")}" loading="eager" decoding="sync" referrerpolicy="no-referrer" onerror="this.outerHTML='${arquivoLink(absMediaUrl(src),nome).replace(/'/g,"&#39;")}'" style="max-width:${mw}px;max-height:${mh}px">`;
  return arquivoLink(absMediaUrl(src),nome);
}
async function uploadArquivoSistema(file,dataUrl){
  const res=await fetch("/api/uploads",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fileName:file.name,mimeType:file.type,dataUrl})});
  const json=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(json.error||"Erro ao enviar arquivo");
  return json.file;
}
async function onFotoPick(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  markFormDirty();
  const p=document.getElementById("fotoPrev");if(p)p.innerHTML='<div class="photo-box">Enviando para o sistema...</div>';
  try{
    const original=await fileDataUrl(f);
    const data=f.type&&f.type.startsWith("image/")?await resizeImgAsync(original,1600,0.78):original;
    const up=await uploadArquivoSistema(f,data);
    window._formFoto=up.imageUrl||up.directUrl||up.viewUrl;
    window._formArquivo={id:up.id,nome:up.name||f.name,mime:up.mimeType||f.type,url:window._formFoto,viewUrl:up.viewUrl};
    if(p)p.innerHTML=fotoImg(window._formFoto,160,120,window._formArquivo.nome,window._formArquivo.mime);
    toast("Arquivo enviado ao sistema. Clique em Salvar para gravar no cadastro.");
  }catch(err){
    window._formFoto="";window._formArquivo=null;
    if(p)p.innerHTML='<div class="photo-box">Falha no envio. Tente novamente.</div>';
    toast((err&&err.message?err.message:"Falha no upload")+". A foto não foi vinculada ao cadastro.");
  }
}
function clearFoto(){markFormDirty();window._formFoto="";window._formArquivo=null;const p=document.getElementById("fotoPrev");if(p)p.innerHTML='<div class="photo-box">Nenhum arquivo anexado</div>';}

async function loadData(){
  try{
    const res=await fetch("/api/data?ts="+Date.now(),{cache:"no-store"});
    if(!res.ok){DATA={};DATA_VERSION="";return;}
    const json=await res.json();
    DATA=json.data||{};
    DATA_VERSION=json.version||"";
  }catch(e){DATA={};DATA_VERSION="";}
  // Garantir estrutura dos módulos
  MODULES.forEach(m=>{if(!Array.isArray(DATA[m.key]))DATA[m.key]=[];});
  Object.keys(SINGLES).forEach(v=>{const st=SINGLES[v].store;if(!DATA[st]||typeof DATA[st]!=="object")DATA[st]=(v==="municipio"?{...MUNI_SEED}:{});});
  // Migração: garante publicar_guia em todos os cadastros
  const internos=new Set(["demanda_turistica","atas_comtur"]);
  MODULES.forEach(m=>{(DATA[m.key]||[]).forEach(r=>{if(r&&typeof r==="object"&&(r.publicar_guia===undefined||r.publicar_guia===null||r.publicar_guia===""))r.publicar_guia=internos.has(m.key)?"Não":"Sim";});});
}
async function saveData(){
  if(!DATA_VERSION){
    toast("Recarregue o sistema antes de salvar. A tela não está sincronizada com o banco.");
    return false;
  }
  try{
    const res=await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:DATA,baseVersion:DATA_VERSION})});
    const json=await res.json().catch(()=>({}));
    if(res.status===409){
      toast(json.error||"Os dados foram alterados em outro computador. Recarregue antes de salvar.");
      return false;
    }
    if(!res.ok)throw new Error(json.error||"Erro ao salvar");
    DATA_VERSION=json.version||DATA_VERSION;
    return true;
  }catch(e){console.error("Erro ao salvar:",e);toast("Não foi possível salvar. Verifique a conexão e tente novamente.");return false;}
}

async function doLogin(){
  const e=document.getElementById("email").value.trim().toLowerCase();
  const s=document.getElementById("senha").value;
  document.getElementById("loginErr").textContent="";
  try{
    const res=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,senha:s})});
    const json=await res.json();
    if(!res.ok){document.getElementById("loginErr").textContent=json.error||"Credenciais inválidas";return;}
    CURRENT=json.user;
    await loadData();
    await loadUsers();
    _showApp();
  }catch(ex){document.getElementById("loginErr").textContent="Erro de conexão com o servidor.";}
}

function go(view){
  if(FORM_GUARD.active&&FORM_GUARD.dirty){
    askUnsavedAction({
      onDiscard:()=>{closeModal(true);go(view);},
      onSaved:()=>{if(!FORM_GUARD.active)go(view);}
    });
    return;
  }
  currentView=view;setActive(view);closeSide();
  if(view==="dashboard")return renderDashboard();
  if(view==="exportar")return renderExport();
  if(view==="usuarios")return renderUsers();
  if(view==="auditoria")return renderAuditLog();
  if(view==="festa_trabalhador")return renderFestaTrabalhador();

  if(MODMAP[view])return renderModule(view);
  renderDashboard();}

function vocCounts(){
  const r=DATA._caractur||{};const fields=[...(window.VOC_TIP||[]),...(window.VOC_MOD||[])];
  const c={Existente:0,Potencial:0,Inexistente:0};
  fields.forEach(f=>{const v=r[f.name];if(v&&c[v]!==undefined)c[v]++;});
  return {c,total:fields.length,aval:c.Existente+c.Potencial+c.Inexistente};
}
function vocPanel(){
  const {c,total,aval}=vocCounts();
  const data=[["Existente",c.Existente,"#1f9d55"],["Potencial",c.Potencial,"#d97706"],["Inexistente",c.Inexistente,"#94a3b8"]];
  const max=Math.max(1,...data.map(d=>d[1]));
  let h=`<div style="font-size:11.5px;color:var(--cinza-claro);margin-bottom:10px">${aval} de ${total} segmentos avaliados na ficha de Caracterização</div>`;
  h+=data.map(d=>`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>${d[0]}</span><b style="color:var(--azul-escuro)">${d[1]}</b></div><div style="background:var(--bg);border-radius:6px;height:10px;overflow:hidden"><div style="width:${d[1]/max*100}%;height:100%;background:${d[2]};border-radius:6px"></div></div></div>`).join("");
  if(aval===0)h+='<div class="empty" style="padding:12px;font-size:12px">Abra "Caracterização do Município em Turismo" e preencha a Vocação.</div>';
  return h;
}
function modEmpresaPanel(){
  const r=DATA._caractur||{};const mods=(window.VOC_MOD||[]);const empresas=DATA.aventura_empresas||[];
  const existentes=mods.filter(m=>r[m.name]==="Existente");
  if(!existentes.length)return '<div class="empty" style="padding:14px;font-size:12.5px">Marque modalidades como "Existente" na Vocação (ficha de Caracterização) para conectá-las às empresas cadastradas.</div>';
  const cont=(label)=>empresas.filter(e=>((e.modalidades||"")+" "+(e.especialidade||"")).toLowerCase().includes(label.toLowerCase())).length;
  return `<ul class="feed">${existentes.map(m=>{const n=cont(m.label);return `<li><span class="dot"></span><span>${m.label}</span><span class="when">${n} empresa(s)</span></li>`;}).join("")}</ul>`;
}
function leitosPanel(){
  const recs=(DATA.hospedagem||[]);
  const data=recs.map(r=>[r.nome||"(sem nome)",parseInt(r.n_leitos,10)||0]).filter(x=>x[1]>0);
  const total=data.reduce((n,x)=>n+x[1],0);
  if(!total)return '<div class="empty" style="padding:14px;font-size:12.5px">Cadastre meios de hospedagem com o nº de leitos para ver a distribuição.</div>';
  data.sort((a,b)=>b[1]-a[1]);
  return `<div style="font-size:11.5px;color:var(--cinza-claro);margin-bottom:10px">Total de leitos no município: <b style="color:var(--azul-escuro)">${total}</b> (100%)</div>`+
    `<div style="display:flex;flex-direction:column;gap:10px">${data.map(d=>{const pct=d[1]/total*100;return `
    <div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>🛏️ ${d[0]}</span><b style="color:var(--azul-escuro)">${pct>=10?Math.round(pct):pct.toFixed(1)}% <span style="color:var(--cinza-claro);font-weight:400">(${d[1]} leitos)</span></b></div>
      <div style="background:var(--bg);border-radius:6px;height:10px;overflow:hidden"><div style="width:${pct.toFixed(2)}%;height:100%;background:linear-gradient(90deg,#2563B0,#1A3A6E);border-radius:6px"></div></div></div>`;}).join("")}</div>`;
}
function acessibilidadePanel(){
  let total=0;const lista=[];
  MODULES.forEach(m=>{(DATA[m.key]||[]).forEach(r=>{total++;
    const acc=Object.keys(r).some(k=>k.toLowerCase().indexOf("acess")>=0 && r[k]==="Sim");

function fieldInput(m,fn,fl,t,optKey,val){
  if(fn==="publicar_guia"&&(val===undefined||val===null||val==="")){val=(m&&["demanda_turistica","atas_comtur"].includes(m.key))?"Não":"Sim";}
  const v=val?String(val).replace(/"/g,"&quot;"):"";
  if(t==="photo"){const cur=val?fotoImg(val,160,120,(window._formArquivo&&window._formArquivo.nome)||"",window._formArquivo&&window._formArquivo.mime):'<div class="photo-box" id="fotoPrevEmpty">Nenhum arquivo anexado</div>';
    return `<div class="field full"><label>${fl}</label><div id="fotoPrev">${cur}</div><input type="file" accept="image/*,.pdf,application/pdf" onchange="onFotoPick(event)" style="font-size:12.5px"> <button type="button" class="iconbtn" onclick="clearFoto()">Remover</button></div>`;}
  let input;
  if(t==="cat"){input=`<select id="f_${fn}"><option value="">—</option>${m.cats.map(o=>`<option ${val===o?"selected":""}>${o}</option>`).join("")}</select>`;}
  else if(t==="sel"){const opts=(fn==="status")?STATUS:(OPT[optKey]||[]);
    input=`<select id="f_${fn}"><option value="">—</option>${opts.map(o=>`<option ${val===o?"selected":""}>${o}</option>`).join("")}</select>`;}
  else if(t==="area"){input=`<textarea id="f_${fn}" rows="3">${v}</textarea>`;}
  else{const tp=t==="num"?"number":t==="url"?"url":t==="tel"?"tel":t==="email"?"email":"text";input=`<input id="f_${fn}" type="${tp}" value="${v}">`;}
  const full=(t==="area")?"full":"";
  return `<div class="field ${full}"><label>${fl}</label>${input}</div>`;
}
function openForm(key,id){
  if(!canEdit())return toast("Seu perfil é somente leitura.");
  const m=MODMAP[key];const r=id?(DATA[key]||[]).find(x=>x.id===id):{};
  window._formFoto=(r&&r.foto)?r.foto:"";
  window._formArquivo=(r&&r.foto)?{id:r.foto_drive_id||"",nome:r.foto_nome||"",mime:r.foto_mime||"",url:r.foto,viewUrl:r.foto_view_url||""}:null;
  let body="";
  m.sections.forEach(sec=>{
    body+=`<div class="form-sec">${sec.t}</div><div class="formgrid">`;
    sec.f.forEach(([fn,fl,t,optKey])=>{body+=fieldInput(m,fn,fl,t,optKey,r?r[fn]:"");});
    body+=`</div>`;
  });
  modal(`${id?"Editar":"Novo"} — ${m.label}`,body,
    `<button class="btn btn-sm" onclick="saveForm('${key}','${id||""}')">Salvar</button>`);
  armFormGuard(()=>saveForm(key,id||""));
}
async function saveForm(key,id){
  const m=MODMAP[key];const obj={};
  allFields(m).forEach(([fn,fl,t])=>{if(t==="photo")return;const el=document.getElementById("f_"+fn);if(el)obj[fn]=el.value.trim();});
  obj.foto=window._formFoto||"";
  obj.foto_drive_id=(window._formArquivo&&window._formArquivo.id)||"";
  obj.foto_nome=(window._formArquivo&&window._formArquivo.nome)||"";
  obj.foto_mime=(window._formArquivo&&window._formArquivo.mime)||"";
  obj.foto_view_url=(window._formArquivo&&window._formArquivo.viewUrl)||"";
  if(!obj.nome){toast("Informe o nome.");return;}
  if(!obj.status)obj.status="Pendente";
  const prev=JSON.parse(JSON.stringify(DATA));
  if(id){const i=DATA[key].findIndex(x=>x.id===id);DATA[key][i]={...DATA[key][i],...obj};}
  else{obj.id=key+"-"+Date.now();DATA[key].push(obj);}
  if(!(await saveData())){DATA=prev;return;}
  FORM_GUARD.dirty=false;
  logAudit(id?"Edição":"Criação",MODMAP[key]?MODMAP[key].label:key,obj.nome);closeModal(true);buildSidebar();setActive(key);renderModule(key);toast(id?"Registro atualizado":"Registro cadastrado");
}
function delRecord(key,id){if(!canEdit())return;const r=DATA[key].find(x=>x.id===id);
  modal("Excluir registro",`<p>Tem certeza que deseja excluir <b>${r.nome}</b>? Esta ação não pode ser desfeita.</p>`,
   `<button class="btn-sec btn-sm" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-sm" style="background:var(--vermelho)" onclick="confirmDel('${key}','${id}')">Excluir</button>`);}
async function confirmDel(key,id){const r=(DATA[key]||[]).find(x=>x.id===id);const prev=JSON.parse(JSON.stringify(DATA));DATA[key]=DATA[key].filter(x=>x.id!==id);if(!(await saveData())){DATA=prev;return;}logAudit("Exclusão",MODMAP[key]?MODMAP[key].label:key,r?r.nome:"—");closeModal();buildSidebar();setActive(key);renderModule(key);toast("Registro excluído");}

function _coletarRel(items,filtros){
  filtros=filtros||{};const q=(filtros.q||"").toLowerCase(),st=filtros.st||"",cat=filtros.cat||"";
  let total=0,body="";
  items.forEach(it=>{
    let recs=(it.recs||[]).filter(r=>{
      const okq=!q||JSON.stringify(r).toLowerCase().includes(q);
      const oks=!st||r.status===st||r.status===undefined;
      const okc=!cat||r.categoria===cat;
      return okq&&oks&&okc;});
    if(!recs.length)return;
    body+=`<h2>${it.icon?it.icon+" ":""}${_escR(it.label)} <span style="font-weight:400;color:#666">(${recs.length})</span></h2>`;
    recs.forEach(r=>{total++;body+=`<div class="rec"><h3>${_escR(r.nome||it.label)}</h3>`;
      const secs=(it.sections&&it.sections.length)?it.sections:[{t:null,f:it.fields}];
      secs.forEach(sec=>{
        if(sec.t==="Contato do Responsável")return;
        const flds=sec.f.filter(([fn,fl,t])=>t!=="photo"&&fn!=="publicar_guia");
        const vals=flds.filter(([fn])=>{const v=r[fn];return v!=null&&String(v).trim()!==""&&String(v).trim()!=="-";});
        if(!vals.length)return;
        if(sec.t)body+=`<div class="sub">${_escR(sec.t)}</div>`;
        vals.forEach(([fn,fl])=>{body+=`<div class="row"><b>${_escR(fl)}:</b> ${_escR(r[fn])}</div>`;});
      });
      if(r.foto)body+=`<div class="foto-label">📷 Arquivo</div>${fotoRelatorioImg(r.foto,520,260,r.foto_nome,r.foto_mime)}`;
      body+=`</div>`;});
  });
  return {body,total};
}

function exportarPDF(items,filtros){
  const {body,total}=_coletarRel(items,filtros);
  if(!total)return toast("Nenhum registro para exportar.");
  try{
    const blob=new Blob([_docHTML(body,total)],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const w=window.open(url,"_blank");
    if(!w){URL.revokeObjectURL(url);return toast("Permita pop-ups para abrir o relatório.");}
    setTimeout(()=>URL.revokeObjectURL(url),15000);
  }catch(e){
    const w=window.open("","_blank");
    if(!w)return toast("Permita pop-ups para abrir o relatório.");
    w.document.open();w.document.write(_docHTML(body,total));w.document.close();
  }
}
function exportarWord(items,filtros){const {body,total}=_coletarRel(items,filtros);if(!total)return toast("Nenhum registro para exportar.");
  const blob=new Blob(["\ufeff"+_docHTML(body,total)],{type:"application/msword"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="relatorio-gestao-turismo-itatinga.doc";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast("Word gerado ("+total+" registros)");}

function _esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function editUser(i){_userModal(i,{...USERS[i]});}
function _userModal(idx,u){
  const nome=u.nome||u.name||"";
  modal(idx<0?"Novo Usuário":"Editar Usuário",
  `<div style="display:grid;gap:10px">
    <label>Nome<input id="u_nome" class="inp" value="${_esc(nome)}" placeholder="Nome completo"></label>

    </select></label>

  `<button class="btn btn-sm" onclick="_saveUser(${idx})">Salvar</button>`);

async function _saveUser(idx){
  const nome=document.getElementById("u_nome").value.trim();
  const email=document.getElementById("u_email").value.trim().toLowerCase();
  const senha=document.getElementById("u_senha").value.trim();
  const role=document.getElementById("u_role").value;
  if(!nome||!email){toast("Preencha nome e login.");return;}
  if(idx<0&&!senha){toast("Informe a senha.");return;}
  if(senha&&senha.length<4){toast("A senha deve ter no mínimo 4 caracteres.");return;}
  try{
    let res;
    if(idx<0){
      res=await fetch("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,nome,role,senha})});
    } else {
      const uid=USERS[idx].id;
      res=await fetch("/api/users/"+uid,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({nome,role,active:true,senha})});
    }
    const json=await res.json();
    if(!res.ok){toast(json.error||"Erro ao salvar usuário");return;}
    logAudit(idx<0?"Criação de usuário":"Edição de usuário","Usuários",nome);
  }catch(e){toast("Erro de conexão");return;}
  closeModal();await renderUsers();toast(idx<0?"Usuário criado":"Usuário atualizado");
}
async function delUser(i){
  const u=USERS[i];
  const nome=u.name||u.nome||u.email;
  if(!confirm("Excluir usuário "+nome+"?"))return;
  try{
    const res=await fetch("/api/users/"+u.id,{method:"DELETE"});
    const json=await res.json();
    if(!res.ok){toast(json.error||"Erro ao excluir");return;}
    logAudit("Exclusão de usuário","Usuários",nome);
  }catch(e){toast("Erro de conexão");return;}
  await renderUsers();toast("Usuário excluído");
}

  const w=window.open("","_blank","width=900,height=700");
  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
    <title>${titulo} — Gestão do Turismo Itatinga</title>
    ${_printCSS(`h2{border-bottom:0;color:#1d4ed8;margin:0 0 12px}.print-page>div:first-of-type{break-inside:avoid;page-break-inside:avoid}`)}
  </head><body>
  <main class="print-page">
  <div class="no-print" style="text-align:right;margin-bottom:12px">
    <button onclick="window.print()" style="background:#1d4ed8;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px">🖨️ Imprimir / Salvar PDF</button>
  </div>
  ${cabecalho}
  <h2>${titulo}</h2>
  ${corpo}
  ${rodape}
  </main>
  </body></html>`);
  w.document.close();
}

function renderFestaTrabalhador(){
  if(!canEdit()&&!(DATA.festa_trabalhador||[]).length){
    document.getElementById("main").innerHTML='<div class="crumb">Sistema › Festa do Trabalhador</div><div class="page-head"><h2>🏅 Indicações — Festa do Trabalhador</h2></div><div class="tablewrap"><div class="empty">Nenhuma indicação cadastrada.</div></div>';return;
  }
  /* Montar datalist com todos os nomes de empresas/cadastros do sistema */
  const allNames=[...new Set(MODULES.filter(m=>m.key!=="festa_trabalhador").flatMap(m=>(DATA[m.key]||[]).map(r=>r.nome).filter(Boolean)))].sort((a,b)=>a.localeCompare(b,"pt"));

  const registros=(DATA.festa_trabalhador||[]);
  const ano=new Date().getFullYear();
  let rows=registros.length
    ?registros.map(r=>`<tr class="row" onclick="openDetail('festa_trabalhador','${r.id}')">
        <td><b>${_esc(r.nome||"—")}</b></td>
        <td>${_esc(r.homenageado||"—")}</td>
        <td><span class="tag">${_esc(r.cargo||"—")}</span></td>
        <td onclick="event.stopPropagation()">
          ${canEdit()?`<button class="iconbtn" onclick="openForm('festa_trabalhador','${r.id}')">Editar</button>
          <button class="iconbtn" onclick="delRecord('festa_trabalhador','${r.id}')">Excluir</button>`:""}
        </td>
      </tr>`).join("")
    :`<tr><td colspan="4" style="text-align:center;color:var(--cinza-claro);padding:24px">Nenhuma indicação. Clique em "+ Adicionar" para começar.</td></tr>`;

  let h=`<div class="crumb">Sistema › Festa do Trabalhador</div>
  <div class="page-head"><div><h2>🏅 Indicações — Festa do Trabalhador</h2>
    <p>${registros.length} indicado(s) · Edição ${ano}</p></div>
    <div style="display:flex;gap:8px">
      ${canEdit()?`<button class="btn btn-sm" onclick="_openFestaMerito()">+ Adicionar indicação</button>`:""}
      <button class="btn-sec btn-sm" style="border-color:#d97706;color:#d97706" onclick="gerarListaFesta()">🏅 Gerar Lista PDF</button>
    </div>
  </div>
  <datalist id="dl_empresas">${allNames.map(n=>`<option value="${_esc(n)}">`).join("")}</datalist>
  <div class="tablewrap"><table>
    <thead><tr><th>Nome da Empresa</th><th>Homenageado</th><th>Cargo / Função</th><th style="text-align:right">Ações</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
  document.getElementById("main").innerHTML=h;
}

function _openFestaMerito(id){
  const rec=id?(DATA.festa_trabalhador||[]).find(r=>r.id===id)||{}:{};
  modal(id?"Editar Indicação":"Nova Indicação — Festa do Trabalhador",
  `<datalist id="dl_emp2">${[...new Set(MODULES.filter(m=>m.key!=="festa_trabalhador").flatMap(m=>(DATA[m.key]||[]).map(r=>r.nome).filter(Boolean)))].sort().map(n=>`<option value="${_esc(n)}">`).join("")}</datalist>
  <div style="display:grid;gap:10px;min-width:340px">
    <label style="font-size:12.5px;font-weight:600">Nome da empresa
      <input id="ft_nome" class="inp" list="dl_emp2" value="${_esc(rec.nome||"")}" placeholder="Digite ou selecione do sistema...">
    </label>
    <label style="font-size:12.5px;font-weight:600">Nome do homenageado
      <input id="ft_homenageado" class="inp" value="${_esc(rec.homenageado||"")}" placeholder="Nome completo">
    </label>
    <label style="font-size:12.5px;font-weight:600">Cargo / Função
      <input id="ft_cargo" class="inp" value="${_esc(rec.cargo||"")}" placeholder="Ex: Gerente, Proprietário...">
    </label>
    <label style="font-size:12.5px;font-weight:600">Observações
      <textarea id="ft_obs" class="inp" rows="2" placeholder="Observações opcionais...">${_esc(rec.observacoes||"")}</textarea>
    </label>
  </div>`,
  `<button class="btn btn-sm" onclick="_salvarFestaMerito('${id||""}')">Salvar</button>`);
  armFormGuard(()=>_salvarFestaMerito(id||""));
}

async function _salvarFestaMerito(id){
  const nome=document.getElementById("ft_nome").value.trim();
  const hom=document.getElementById("ft_homenageado").value.trim();
  const cargo=document.getElementById("ft_cargo").value.trim();
  const obs=document.getElementById("ft_obs").value.trim();
  if(!nome||!hom){toast("Informe a empresa e o homenageado.");return;}
  const prev=JSON.parse(JSON.stringify(DATA));
  if(!DATA.festa_trabalhador)DATA.festa_trabalhador=[];
  if(id){
    const i=DATA.festa_trabalhador.findIndex(r=>r.id===id);
    if(i>=0)DATA.festa_trabalhador[i]={...DATA.festa_trabalhador[i],nome,homenageado:hom,cargo,observacoes:obs};
  }else{
    DATA.festa_trabalhador.push({id:"festa-"+Date.now(),nome,homenageado:hom,cargo,observacoes:obs,publicar_guia:"Não"});
  }
  if(!(await saveData())){DATA=prev;return;}
  logAudit(id?"Edição":"Criação","Festa do Trabalhador",nome);
  FORM_GUARD.dirty=false;
  closeModal(true);renderFestaTrabalhador();toast(id?"Indicação atualizada":"Indicação adicionada");
}

function gerarListaFesta(){
  const lista=(DATA.festa_trabalhador||[]);
  if(!lista.length)return toast("Nenhuma indicação cadastrada.");
  const ano=new Date().getFullYear();
  const hoje=new Date().toLocaleDateString("pt-BR");
  const rows=lista.map((r,i)=>`
    <tr style="background:${i%2===0?"#fff":"#f8fafc"}">
      <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;font-size:13px;font-weight:600;color:#1e3a8a">${i+1}º</td>
      <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;font-size:13px"><b>${_escR(r.nome||"—")}</b></td>
      <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;font-size:13px">${_escR(r.homenageado||"—")}</td>
      <td style="padding:10px 14px;border-bottom:1px solid #e2e8f0;font-size:13px;color:#4b5563">${_escR(r.cargo||"—")}</td>
    </tr>`).join("");

  const html2=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
    <title>Medalhas de Honra ao Mérito — Festa do Trabalhador ${ano}</title>
    ${_printCSS(`h1{color:#1e3a8a;font-size:18px;margin:0}h2{border-bottom:0;color:#4b5563;font-size:12px;font-weight:400;margin:4px 0 0}table{margin-top:16px}tfoot td{font-size:10.5px;color:#6b7280;border-top:2px solid #e2e8f0}.header{border-bottom:3px solid #1e3a8a;padding-bottom:12px;margin-bottom:6px;display:flex;align-items:flex-start;justify-content:space-between;break-inside:avoid;page-break-inside:avoid}.medal{font-size:28px;line-height:1}`)}
  </head><body>
  <main class="print-page">
  <div class="no-print" style="text-align:right;margin-bottom:14px">
    <button onclick="window.print()" style="background:#1e3a8a;color:#fff;border:none;padding:9px 20px;border-radius:6px;cursor:pointer;font-size:13px">🖨️ Imprimir / Salvar PDF</button>
  </div>
  <div class="header">
    <div>
      <h1>🏅 Medalhas de Honra ao Mérito</h1>
      <h2>Festa do Trabalhador — ${ano} · Prefeitura Municipal de Itatinga</h2>
      <div style="font-size:11.5px;color:#9ca3af;margin-top:6px">Diretoria de Lazer, Turismo e Eventos · Emitido em ${hoje}</div>
    </div>
    <div class="medal">🏅</div>
  </div>
  <table>
    <thead><tr><th>#</th><th>Empresa</th><th>Homenageado</th><th>Cargo / Função</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="4">Total de indicados: <b>${lista.length}</b> · Gerado pelo Sistema de Gestão do Turismo de Itatinga</td></tr></tfoot>
  </table>
  </main>
  </body></html>`;

  try{
    const blob=new Blob([html2],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const w=window.open(url,"_blank");
    if(!w){URL.revokeObjectURL(url);return toast("Permita pop-ups para abrir a lista.");}
    setTimeout(()=>URL.revokeObjectURL(url),15000);
  }catch(e){
    const w=window.open("","_blank");
    if(!w)return toast("Permita pop-ups.");
    w.document.open();w.document.write(html2);w.document.close();
  }
}
/* ===== busca global ===== */
function globalSearch(q){
  if(!q||q.length<2){if(currentView==="dashboard"||currentView==="_search")renderDashboard();return;}
  const res=[];MODULES.forEach(m=>(DATA[m.key]||[]).forEach(r=>{if(JSON.stringify(r).toLowerCase().includes(q.toLowerCase()))res.push({m,r});}));
  let h=`<div class="crumb">Busca</div><div class="page-head"><div><h2>🔎 Resultados para "${q}"</h2><p>${res.length} encontrado(s)</p></div></div>`;
  if(!res.length)h+=`<div class="tablewrap"><div class="empty">Nada encontrado.</div></div>`;
  else{h+=`<div class="tablewrap"><table><thead><tr><th>Nome</th><th>Módulo</th><th>Categoria</th></tr></thead><tbody>
    ${res.map(x=>`<tr class="row" onclick="openDetail('${x.m.key}','${x.r.id}')"><td><b>${x.r.nome}</b></td><td>${x.m.icon} ${x.m.label}</td><td><span class="tag">${x.r.categoria||"—"}</span></td></tr>`).join("")}</tbody></table></div>`;}
  document.getElementById("main").innerHTML=h;currentView="_search";}

/* ===== modal/toast ===== */
function modal(title,body,footer){clearFormGuard();document.getElementById("modalRoot").innerHTML=`<div class="modal-bg"><div class="modal"><div class="mh"><h3>${title}</h3><button class="x" onclick="closeModal()" title="Fechar">×</button></div><div class="mb">${body}</div><div class="mf">${footer||""}</div></div></div>`;}
function closeModal(force){
  if(!force&&FORM_GUARD.active&&FORM_GUARD.dirty){
    askUnsavedAction({onDiscard:()=>closeModal(true)});
    return;
  }
  document.getElementById("modalRoot").innerHTML="";
  clearFormGuard();
}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.getElementById("toastRoot").appendChild(t);setTimeout(()=>t.remove(),2200);}
document.getElementById("senha").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
window.addEventListener("beforeunload",e=>{
  if(FORM_GUARD.active&&FORM_GUARD.dirty){
    e.preventDefault();
    e.returnValue="";
  }
});

// ── Verificar sessão ativa ao carregar a página ──────────────────────────────
(async function initApp(){
  if(location.protocol==="file:"){
    document.getElementById("loginErr").textContent="Abra pelo endereço online: https://inventario.turismoitatinga.com.br/gestor/";
    toast("Este arquivo local não salva no sistema online.");
    return;
  }
  try{
    const res=await fetch("/api/auth/me");
    if(res.ok){
      const json=await res.json();
      CURRENT=json.user;
      await loadData();
      await loadUsers();
      _showApp();
    }
  }catch(e){
    document.getElementById("loginErr").textContent="Sem conexão com o servidor online. Os dados não serão salvos neste dispositivo.";
  }
})();
</script>
